<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1528" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cumple" />
    <meta name="description" content="Una sorpresa de cumpleaños para Mirggi." />
    <title>Cumple — Mirggi</title>
    <link rel="icon" href="../icons/cumple.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../shared/home-link.css" />
    <style>
      :root {
        --ink: #f7f1e8;
        --ink-soft: rgba(247, 241, 232, 0.72);
        --night: #1a1528;
        --plum: #3a2458;
        --rose: #ff6b8a;
        --gold: #f0c35a;
        --mint: #6ee7b7;
        --font-display: "Fraunces", Georgia, serif;
        --font-body: "Outfit", system-ui, sans-serif;
        --safe-t: env(safe-area-inset-top, 0px);
        --safe-b: env(safe-area-inset-bottom, 0px);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        height: 100%;
      }

      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        font-family: var(--font-body);
        color: var(--ink);
        background: var(--night);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      button {
        font: inherit;
        color: inherit;
        border: none;
        background: none;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .home-link {
        --hl-ink: #f7f1e8;
        --hl-muted: rgba(247, 241, 232, 0.7);
        position: relative;
        z-index: 5;
        margin: 0;
      }

      .sky {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(900px 520px at 12% -10%, rgba(255, 107, 138, 0.28), transparent 55%),
          radial-gradient(760px 480px at 100% 8%, rgba(240, 195, 90, 0.18), transparent 50%),
          radial-gradient(640px 420px at 50% 110%, rgba(58, 36, 88, 0.9), transparent 55%),
          linear-gradient(165deg, #241a36 0%, var(--night) 48%, #120e1c 100%);
      }

      .sky::after {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.45;
        background-image: radial-gradient(rgba(247, 241, 232, 0.55) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.7), transparent 70%);
      }

      .app {
        position: relative;
        z-index: 1;
        width: min(28rem, 100%);
        margin: 0 auto;
        min-height: 100dvh;
        padding: calc(0.75rem + var(--safe-t)) 1rem calc(1.25rem + var(--safe-b));
        display: flex;
        flex-direction: column;
      }

      .screen {
        display: none;
        flex: 1;
        flex-direction: column;
      }

      .screen.active {
        display: flex;
      }

      .hero {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding-bottom: 1.5rem;
        animation: rise 0.55s ease-out both;
      }

      .eyebrow {
        margin: 0 0 0.55rem;
        font-size: 0.82rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--gold);
      }

      h1 {
        margin: 0;
        font-family: var(--font-display);
        font-size: clamp(2.4rem, 11vw, 3.4rem);
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.05;
      }

      .lead {
        margin: 0.85rem 0 1.5rem;
        max-width: 22rem;
        font-size: 1.05rem;
        font-weight: 500;
        line-height: 1.45;
        color: var(--ink-soft);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 3.1rem;
        padding: 0.85rem 1.35rem;
        border-radius: 999px;
        font-weight: 700;
        font-size: 1rem;
        transition: transform 0.15s ease, background 0.2s ease;
      }

      .btn:active {
        transform: scale(0.97);
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--rose), #ff8fb0 55%, var(--gold));
        color: #1a1220;
        box-shadow: 0 12px 32px rgba(255, 107, 138, 0.35);
      }

      .btn-ghost {
        margin-top: 0.65rem;
        color: var(--ink-soft);
        text-decoration: underline;
        text-underline-offset: 3px;
        font-weight: 600;
        font-size: 0.9rem;
      }

      .play-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 0.75rem;
      }

      .score {
        font-weight: 700;
        font-size: 0.95rem;
        color: var(--gold);
        font-variant-numeric: tabular-nums;
      }

      .hint {
        margin: 0;
        font-size: 0.88rem;
        font-weight: 600;
        color: var(--ink-soft);
      }

      .arena {
        position: relative;
        flex: 1;
        border-radius: 24px;
        overflow: hidden;
        border: 1px solid rgba(247, 241, 232, 0.12);
        background: rgba(255, 255, 255, 0.04);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03);
        touch-action: manipulation;
      }

      .balloon {
        position: absolute;
        width: 4.4rem;
        height: 5.4rem;
        border: none;
        padding: 0;
        background: transparent;
        left: 0;
        bottom: -6rem;
        animation: float-up linear forwards;
        will-change: transform;
      }

      .balloon-body {
        display: grid;
        place-items: center;
        width: 4.4rem;
        height: 4.6rem;
        border-radius: 50% 50% 48% 48%;
        color: #1a1220;
        font-size: 1.35rem;
        font-weight: 800;
        box-shadow:
          inset -10px -14px 24px rgba(0, 0, 0, 0.18),
          inset 8px 10px 18px rgba(255, 255, 255, 0.35),
          0 10px 24px rgba(0, 0, 0, 0.25);
        transform-origin: 50% 100%;
        animation: sway 2.4s ease-in-out infinite alternate;
      }

      .balloon::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 0.15rem;
        width: 1.5px;
        height: 1.1rem;
        background: rgba(247, 241, 232, 0.45);
        transform: translateX(-50%);
      }

      .balloon.special .balloon-body {
        background: linear-gradient(160deg, var(--gold), #ffe29a) !important;
        box-shadow:
          inset -10px -14px 24px rgba(0, 0, 0, 0.12),
          inset 8px 10px 18px rgba(255, 255, 255, 0.45),
          0 0 28px rgba(240, 195, 90, 0.55);
      }

      .balloon.popping {
        pointer-events: none;
        animation: none;
        transform: translate(var(--x), var(--y));
      }

      .balloon.popping .balloon-body {
        animation: pop 0.28s ease-out forwards;
      }

      .reveal {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: center;
        align-items: center;
        animation: rise 0.6s ease-out both;
      }

      .reveal h1 {
        background: linear-gradient(120deg, var(--gold), var(--rose), #fff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .reveal .lead {
        max-width: 22rem;
        margin-inline: auto;
      }

      .cake {
        font-size: 3.5rem;
        line-height: 1;
        margin-bottom: 0.75rem;
        filter: drop-shadow(0 8px 18px rgba(240, 195, 90, 0.35));
        animation: bob 2s ease-in-out infinite;
      }

      .cats {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 0.85rem;
        margin: 0 0 0.85rem;
        pointer-events: none;
      }

      .cat {
        width: 4.4rem;
        height: auto;
        filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.28));
        animation: bob 2.4s ease-in-out infinite;
      }

      .cat.orange {
        animation-delay: 0.15s;
      }

      .cat.white {
        animation-delay: 0.55s;
        width: 4rem;
      }

      .cats-corner {
        position: absolute;
        right: 0.35rem;
        bottom: 0.2rem;
        display: flex;
        align-items: flex-end;
        gap: 0.35rem;
        pointer-events: none;
        z-index: 2;
      }

      .cats-corner .cat {
        width: 3.1rem;
      }

      .cats-corner .cat.white {
        width: 2.85rem;
      }

      #confetti {
        position: fixed;
        inset: 0;
        z-index: 4;
        pointer-events: none;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes float-up {
        to {
          transform: translate(var(--drift), calc(-100dvh - 8rem));
        }
      }

      @keyframes sway {
        from {
          transform: rotate(-7deg);
        }
        to {
          transform: rotate(7deg);
        }
      }

      @keyframes pop {
        0% {
          transform: scale(1);
          opacity: 1;
        }
        60% {
          transform: scale(1.35);
          opacity: 0.9;
        }
        100% {
          transform: scale(0);
          opacity: 0;
        }
      }

      @keyframes bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .sky,
        .balloon-body,
        .cake,
        .hero,
        .reveal {
          animation: none !important;
        }

        .balloon {
          animation-duration: 12s !important;
        }
      }
    </style>
  </head>

    <script>
      const NEED = 10;
      const COLORS = ["#ff6b8a", "#f0c35a", "#6ee7b7", "#8bb7ff", "#ff9e6b", "#d8a7ff"];
      const EMOJIS = ["🎈", "✨", "💖", "⭐", "🎉", "🌸", "🐱", "🐈"];

      const screens = {
        home: document.getElementById("screen-home"),
        play: document.getElementById("screen-play"),
        reveal: document.getElementById("screen-reveal"),
      };
      const arena = document.getElementById("arena");
      const scoreEl = document.getElementById("score");
      const canvas = document.getElementById("confetti");
      const ctx = canvas.getContext("2d");

      let popped = 0;
      let spawnTimer = 0;
      let playing = false;
      let won = false;
      let confettiBits = [];
      let confettiRaf = 0;
      let specialQueued = false;

      function show(name) {
        Object.entries(screens).forEach(([key, el]) => {
          el.classList.toggle("active", key === name);
        });
      }

      function updateScore() {
        scoreEl.textContent = `${popped} / ${NEED}`;
      }

      function clearArena() {
        const cats = arena.querySelector(".cats-corner");
        arena.innerHTML = "";
        if (cats) arena.appendChild(cats);
      }

      function spawnBalloon() {
        if (!playing || won) return;

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "balloon";
        btn.setAttribute("aria-label", "Reventar globo");

        const isSpecial =
          !specialQueued && popped >= Math.max(3, NEED - 3) && Math.random() < 0.55;
        if (isSpecial) {
          specialQueued = true;
          btn.classList.add("special");
        }

        const color = COLORS[Math.floor(Math.random() * COLORS.length)];
        const emoji = isSpecial
          ? "🎁"
          : EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
        const left = 8 + Math.random() * 72;
        const drift = `${(Math.random() * 40 - 20).toFixed(1)}vw`;
        const duration = 5.5 + Math.random() * 3.5;

        btn.style.left = `${left}%`;
        btn.style.setProperty("--drift", drift);
        btn.style.animationDuration = `${duration}s`;

        btn.innerHTML = `<span class="balloon-body" style="background:linear-gradient(160deg, ${color}, color-mix(in srgb, ${color} 70%, white))">${emoji}</span>`;

        btn.addEventListener("click", () => popBalloon(btn, isSpecial));
        btn.addEventListener("animationend", () => {
          if (!btn.classList.contains("popping")) btn.remove();
        });

        arena.appendChild(btn);
      }

      function popBalloon(btn, isSpecial) {
        if (!playing || won || btn.classList.contains("popping")) return;

        const rect = btn.getBoundingClientRect();
        const arenaRect = arena.getBoundingClientRect();
        btn.style.setProperty("--x", `${rect.left - arenaRect.left}px`);
        btn.style.setProperty("--y", `${rect.top - arenaRect.top}px`);
        btn.classList.add("popping");
        btn.style.left = "0";
        btn.style.bottom = "auto";
        btn.style.top = "0";

        popped += 1;
        updateScore();
        burst(rect.left + rect.width / 2, rect.top + rect.height / 2, isSpecial);

        window.setTimeout(() => btn.remove(), 280);

        if (isSpecial || popped >= NEED) {
          win();
        }
      }

      function win() {
        if (won) return;
        won = true;
        playing = false;
        window.clearInterval(spawnTimer);
        window.setTimeout(() => {
          show("reveal");
          startConfetti();
        }, 350);
      }

      function startGame() {
        popped = 0;
        won = false;
        playing = true;
        specialQueued = false;
        updateScore();
        clearArena();
        stopConfetti();
        show("play");
        spawnBalloon();
        window.clearInterval(spawnTimer);
        spawnTimer = window.setInterval(spawnBalloon, 700);
      }

      function burst(x, y, fancy) {
        const n = fancy ? 28 : 14;
        for (let i = 0; i < n; i++) {
          confettiBits.push({
            x,
            y,
            vx: (Math.random() - 0.5) * (fancy ? 14 : 9),
            vy: -Math.random() * 10 - 2,
            g: 0.28,
            life: 1,
            w: 4 + Math.random() * 5,
            h: 8 + Math.random() * 8,
            rot: Math.random() * Math.PI,
            vr: (Math.random() - 0.5) * 0.4,
            color: fancy
              ? COLORS[Math.floor(Math.random() * COLORS.length)]
              : COLORS[Math.floor(Math.random() * COLORS.length)],
          });
        }
        if (!confettiRaf) tickConfetti();
      }

      function startConfetti() {
        resizeCanvas();
        for (let i = 0; i < 90; i++) {
          confettiBits.push({
            x: Math.random() * canvas.width,
            y: -20 - Math.random() * canvas.height * 0.4,
            vx: (Math.random() - 0.5) * 3,
            vy: 2 + Math.random() * 4,
            g: 0.05,
            life: 1.4 + Math.random(),
            w: 5 + Math.random() * 6,
            h: 9 + Math.random() * 8,
            rot: Math.random() * Math.PI,
            vr: (Math.random() - 0.5) * 0.25,
            color: COLORS[Math.floor(Math.random() * COLORS.length)],
          });
        }
        if (!confettiRaf) tickConfetti();
      }

      function stopConfetti() {
        confettiBits = [];
        if (confettiRaf) {
          cancelAnimationFrame(confettiRaf);
          confettiRaf = 0;
        }
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }

      function resizeCanvas() {
        canvas.width = window.innerWidth * devicePixelRatio;
        canvas.height = window.innerHeight * devicePixelRatio;
        canvas.style.width = `${window.innerWidth}px`;
        canvas.style.height = `${window.innerHeight}px`;
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      }

      function tickConfetti() {
        confettiRaf = requestAnimationFrame(tickConfetti);
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        confettiBits = confettiBits.filter((p) => {
          p.vy += p.g;
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vr;
          p.life -= 0.012;
          if (p.life <= 0 || p.y > window.innerHeight + 40) return false;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
          return true;
        });
        if (!confettiBits.length) {
          cancelAnimationFrame(confettiRaf);
          confettiRaf = 0;
          ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        }
      }

      document.getElementById("btn-start").addEventListener("click", startGame);
      document.getElementById("btn-again").addEventListener("click", startGame);
      document.getElementById("btn-home").addEventListener("click", () => {
        playing = false;
        won = false;
        window.clearInterval(spawnTimer);
        clearArena();
        stopConfetti();
        show("home");
      });

      window.addEventListener("resize", () => {
        if (confettiBits.length) resizeCanvas();
      });
      resizeCanvas();
    </script>
  </body>
</html>
